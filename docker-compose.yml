services:
  db:
    image: postgres:15-alpine
    container_name: nest_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: nest_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: nest_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: yoke_api
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the network the services are reached by name, on their container ports.
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # File events don't cross a Windows bind mount, so tsc's watcher has to poll.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    command: sh -c "npm run migration:run -w api && npm run start:dev -w api"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Keep the image's Linux node_modules instead of the host's.
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: yoke_web
    restart: unless-stopped
    environment:
      API_TARGET: http://api:3000
      VITE_USE_POLLING: "true"
    command: npm run dev -w web -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
